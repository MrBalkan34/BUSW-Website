# Example only. Copy to docker-compose.yml, review every line, and fill in apps/server/.env (see .env.example there).
# UNTESTED: written without Docker available. Nothing here has been run or deployed.
#
#   docker compose up -d --build

services:
  account:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../apps/server/.env          # APP_ORIGIN, BETTER_AUTH_SECRET, SMTP_URL, ... never commit this file
    environment:
      TRUST_PROXY: "true"                  # only because Caddy (below) sets X-Forwarded-For itself
    volumes:
      - bu-data:/data                      # database and private images: back this up (npm run backup)
    expose:
      - "8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                   # certificates
    depends_on:
      - account

volumes:
  bu-data:
  caddy-data:
